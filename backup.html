// Validate complaint photos/videos
const complaintFileInput = document.getElementById('complaintFile');

if (!complaintFileInput || !complaintFileInput.files || complaintFileInput.files.length === 0) {
    $('#complaint-error');
    isValid = false;
} else {
    const files = Array.from(complaintFileInput.files);

    let invalidType = false;
    let largeVideos = false;

    files.forEach(file => {
        const name = file.name.toLowerCase();

        // Allow only image and video extensions
        const isImage = (file.type.startsWith('image/'));
        const isVideo = (
            file.type.startsWith('video/') ||
            name.endsWith('.mp4') ||
            name.endsWith('.mov') ||
            name.endsWith('.avi') ||
            name.endsWith('.mkv') ||
            name.endsWith('.wmv')
        );

        if (!isImage && !isVideo) {
            invalidType = true;
        }

        // Video size check (30MB max)
        if (isVideo && file.size > 30 * 1024 * 1024) {
            largeVideos = true;
        }
    });

    if (invalidType) {
        $('#complaint-error').text('Only images and videos are allowed');
        isValid = false;
    } else if (largeVideos) {
        $('#complaint-error').text('Each video must be less than 30 MB');
        isValid = false;
    }
}

//===========================
// File processing helpers
// ===========================
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

//===========================
// File upload helpers (DEPRECATED - keeping for reference)
// ===========================
async function getUploadUrl(file, folder) {
  const qs = new URLSearchParams({
    fileName: file.name,
    contentType: file.type,
    folder: folder || 'complaints'
  });
  
  const url = 'https://servicerequest.shanthigears.com/api/upload-url?' + qs.toString();
  console.log('Requesting upload URL from:', url);
  
  try {
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      mode: 'cors',
      credentials: 'omit'
    });
    
    console.log('Upload URL response status:', res.status);
    
    if (!res.ok) {
      const errorText = await res.text();
      console.error('Upload URL request failed:', errorText);
      throw new Error(`Failed to get upload URL: ${res.status} - ${errorText}`);
    }
    
    const result = await res.json();
    console.log('Upload URL response:', result);
    return result; // { uploadUrl, publicUrl }
  } catch (error) {
    console.error('Network error getting upload URL:', error);
    throw new Error(`Network error: ${error.message}`);
  }
}

async function uploadToSpaces(file, folder, retryCount = 0) {
  const maxRetries = 2;
  
  try {
    console.log(`Starting upload for ${file.name} to folder ${folder} (attempt ${retryCount + 1})`);
    const { uploadUrl, publicUrl } = await getUploadUrl(file, folder);
    console.log('Got upload URL:', uploadUrl);
    console.log('Expected public URL:', publicUrl);
    
    const putRes = await fetch(uploadUrl, {
      method: 'PUT',
      headers: { 
        'Content-Type': file.type,
        'x-amz-acl': 'public-read'
      },
      body: file,
      mode: 'cors',
      credentials: 'omit'
    });
    
    console.log('Upload response status:', putRes.status);
    console.log('Upload response headers:', putRes.headers);
    
    if (!putRes.ok) {
      const errorText = await putRes.text();
      console.error('Upload failed response:', errorText);
      throw new Error(`Upload failed with status: ${putRes.status} - ${errorText}`);
    }
    
    console.log(`Successfully uploaded ${file.name}`);
    return publicUrl;
  } catch (error) {
    console.error('Upload error:', error);
    
    // Retry logic for network errors
    if (error.message.includes('Failed to fetch') && retryCount < maxRetries) {
      console.log(`Retrying upload for ${file.name} (attempt ${retryCount + 2})`);
      await new Promise(resolve => setTimeout(resolve, 1000 * (retryCount + 1))); // Wait before retry
      return uploadToSpaces(file, folder, retryCount + 1);
    }
    
    if (error.message.includes('Failed to fetch')) {
      throw new Error(`Network error uploading ${file.name}. Please check your internet connection and try again.`);
    }
    throw new Error(`Failed to upload ${file.name}: ${error.message}`);
  }
}

				// Main submit handler
		async function handleSubmit() {
			console.log('Submit button clicked');

			// Disable submit button and show loading
			$('#submitBtn').prop('disabled', true);
			$('#submitText').hide();
			$('#submitLoader').show();

			try {
				const formData = collectFormData();
				console.log('Form data collected:', formData);

				if (!validateFormData(formData)) {
					console.log('Validation failed');
					// Re-enable submit button on validation failure
					$('#submitBtn').prop('disabled', false);
					$('#submitText').show();
					$('#submitLoader').hide();
					return;
				}

				// Convert complaint photos to base64
				const complaintFiles = Array.from(document.getElementById('complaintFile').files || []);
				const complaintPhotos = [];
				console.log(`Found ${complaintFiles.length} complaint files to process`);
				
				if (complaintFiles.length > 0) {
					for (const f of complaintFiles) {
						console.log(`Processing complaint file: ${f.name} (${f.size} bytes, ${f.type})`);
						try {
							const base64 = await fileToBase64(f);
							complaintPhotos.push({
								name: f.name,
								type: f.type,
								size: f.size,
								data: base64
							});
							console.log(`Successfully processed complaint photo: ${f.name}`);
						} catch (error) {
							console.error('Error processing complaint photo:', error);
							jSuites.notification({
								name: "Gearbox Form",
								message: `Error processing ${f.name}. Please try again.`,
								type: 'error'
							});
							// Re-enable submit button on error
							$('#submitBtn').prop('disabled', false);
							$('#submitText').show();
							$('#submitLoader').hide();
							return;
						}
					}
				}

				// Convert forced lubrication photos to base64 if applicable
				let forcedLubricationPhotos = [];
				let fracturedSurfacePhotos = [];
				
				if (formData.forced_lubrication_selection === 'yes') {
					const forcedFiles = Array.from(document.getElementById('forcedLubricationFile').files || []);
					console.log(`Found ${forcedFiles.length} forced lubrication files to process`);
					
					if (forcedFiles.length > 0) {
						for (const f of forcedFiles) {
							console.log(`Processing forced lubrication file: ${f.name} (${f.size} bytes, ${f.type})`);
							try {
								const base64 = await fileToBase64(f);
								const fileData = {
									name: f.name,
									type: f.type,
									size: f.size,
									data: base64
								};
								
								// Add to both arrays
								forcedLubricationPhotos.push(fileData);
								fracturedSurfacePhotos.push(fileData);
								
								console.log(`Successfully processed forced lubrication photo: ${f.name}`);
							} catch (error) {
								console.error('Error processing forced lubrication photo:', error);
								jSuites.notification({
									name: "Gearbox Form",
									message: `Error processing ${f.name}. Please try again.`,
									type: 'error'
								});
								// Re-enable submit button on error
								$('#submitBtn').prop('disabled', false);
								$('#submitText').show();
								$('#submitLoader').hide();
								return;
							}
						}
					}
				}

				// Add image data to payload
				formData.complaint_photos = complaintPhotos;
				formData.forced_lubrication_photos = forcedLubricationPhotos;
				formData.fractured_surface_photos = fracturedSurfacePhotos;

				console.log('Validation passed, submitting...');

				const response = await fetch('https://servicerequest.shanthigears.com/api/complaints', {
				//const response = await fetch('http://localhost:6451/api/complaints', {
					
				method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Accept': 'application/json'
					},
					body: JSON.stringify(formData)
				});

				console.log('Response status:', response.status);
				const result = await response.json();
				console.log('Response data:', result);
				if (response.ok && result.success) {
					jSuites.notification({
						name: "Gearbox Form",
						message: "Complaint submitted successfully! Thank you for your submission.",
						type: 'success'
					});
					resetForm();
				} else {
					const errorMessage = result.error || result.message || "Submission failed. Please try again.";
					jSuites.notification({
						name: "Gearbox Form",
						message: errorMessage,
						type: 'error'
					});
					console.error('Submission failed:', result);
				}
			} catch (err) {
				console.error("Submit error:", err);
				jSuites.notification({
					name: "Gearbox Form",
					message: "Network error. Please check your connection and try again.",
					type: 'error'
				});
			} finally {
				// Re-enable submit button
				$('#submitBtn').prop('disabled', false);
				$('#submitText').show();
				$('#submitLoader').hide();
			}
		}

        function fetchCountries() {
            $.ajax({
                url: 'https://servicerequest.shanthigears.com/api/countries',
                // url: 'http://localhost:6451/api/countries',
                type: 'GET',
                dataType: 'json',
                success: function (response) {
                    console.log("response", response);
                    //if (response.status && Array.isArray(response.data)) {
                    const countries = response;
                    const select = $('#location'); // ✅ Correct dropdown ID
                    select.find('option:not(:first)').remove(); // keep "Choose Country" only

                    countries.forEach(country => {
                        const option = $('<option></option>')
                            .val(country.countryId) // ✅ use numeric ID for backend consistency
                            .text(country.countryName);
                        select.append(option);
                    });
                    //  } else {
                    //  console.warn("No country data received or invalid response format.");
                    // }
                },
                error: function (xhr, status, error) {
                    console.error('Error fetching countries:', error);
                }
            });
        }




function fetchStates(countryId) {
    if (!countryId) {
        $('#states-dropdown').find('option:not(:first)').remove();
        return;
    }

    $.ajax({
       url: `https://servicerequest.shanthigears.com/api/territories?countryId=${countryId}`,
	//    url: `https://servicerequest.shanthigears.com/api/territories?countryId=${countryId}`,
        type: 'GET',
        dataType: 'json',
        success: function (response) {
            const states = response;
            const select = $('#states-dropdown');
            select.find('option:not(:first)').remove();

            if (Array.isArray(states) && states.length > 0) {
                states.forEach(state => {
                    const option = $('<option></option>')
                        .val(state.territoryId)
                        .text(state.territoryName);
                    select.append(option);
                });
            } else {
                const option = $('<option></option>').text('No states available').attr('disabled', true);
                select.append(option);
            }
        },
        error: function (xhr, status, error) {
            console.error('Error fetching states:', error);
        }
    });
}

    function toggleStateDropdown() {
    const locationSelect = document.getElementById('location');
    const countryId = locationSelect.value; // ✅ Country ID
    const selectedCountryName = locationSelect.options[locationSelect.selectedIndex].text;
    const statesDropdown = document.getElementById('states-dropdown');

    if (selectedCountryName === 'India') {
        $('#states-dropdown').show();
        fetchStates(countryId);
    } else {
        $('#states-dropdown').hide();
        $('#states-dropdown').find('option:not(:first)').remove();
    }
}

        // Enhanced validation function
        function validateFormData(data) {
            let isValid = true;
            $('.error-message').text('');

            const requiredFields = [
                ['contact_person_name', 'personName', 'Contact Person Name is required'],
                ['email', 'email', 'Email is required'],
                ['mobile_number', 'phone', 'Mobile Number is required'],
                ['company_name', 'companyName', 'Company Name is required'],
               // ['location', 'location', 'Country selection is required'],
                ['gearbox_serial_number', 'gearboxSerial', 'Gearbox Serial Number is required'],
                ['date_of_commissioning', 'commissionDate', 'Date of Commissioning is required'],
                ['nature_of_complaint', 'complaint', 'Nature of Complaint is required'],
                ['input_motor_details_kw', 'motorDetails', 'Input Motor Details is required'],
                ['input_output_connection_details', 'connectionDetails', 'Connection Details is required'],
                ['oil_level_details', 'oilLevel', 'Oil Level Details is required'],
                ['condition_of_breather', 'breatherCondition', 'Breather Condition is required'],
                ['alignment_input_output', 'alignment', 'Alignment details are required'],
                ['running_hours_per_day', 'runningHours', 'Running Hours is required'],
                ['dismantled_before_failure', 'dismantled', 'Please specify if gearbox was dismantled'],
                ['ambient_conditions', 'atmosphere', 'Atmospheric conditions are required'],
                ['forced_lubrication_selection', 'forcedLubricationSelect', 'Forced lubrication selection is required'],
                ['input_speed_details', 'inputSpeed', 'Input speed details are required'],
                ['failure_history_details', 'failureType', 'Failure history details are required']
            ];
            requiredFields.forEach(([dataKey, elementId, message]) => {
                const value = data[dataKey];
                if (!value || (typeof value === 'string' && value.trim() === '') ||
                    (typeof value === 'number' && value === 0 && dataKey.includes('details'))) {
                    $(`#${elementId}-error`).text(message);
                    isValid = false;
                }
            });
				

						// Country is always required
			if (!data.country_id) {
				$('#location-error').text('Please select a country');
				isValid = false;
			}

			// State required only for India
			if ($('#location option:selected').text() === 'India' && !data.territory_id) {
				$('#states-error').text('Please select a state for India');
				isValid = false;
			}

			
			
            // Email format validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (data.email && !emailPattern.test(data.email)) {
                $('#email-error').text('Please enter a valid email address');
                isValid = false;
            }

            // Phone number validation
            if (data.mobile_number && data.mobile_number.length < 10) {
                $('#phone-error').text('Please enter a valid mobile number');
                isValid = false;
            }
            // Date validation
            if (data.date_of_commissioning) {
                const commissionDate = new Date(data.date_of_commissioning);
                const today = new Date();
                if (commissionDate > today) {
                    $('#commissionDate-error').text('Commissioning date cannot be in the future');
                    isValid = false;
                }
            }

            // Numeric validations
            if (data.running_hours_per_day > 24) {
                $('#runningHours-error').text('Running hours cannot exceed 24 hours per day');
                isValid = false;
            }

			// Validate complaint photos
// Validate complaint photos (REQUIRED check + file type check)
const complaintFileInput = document.getElementById('complaintFile');

if (!complaintFileInput || !complaintFileInput.files || complaintFileInput.files.length === 0) {
    $('#complaint-error') .text('Please upload at least one complaint photo or video');
    isValid = false;
} else {
    const files = Array.from(complaintFileInput.files);
    const invalidFiles = files.filter(file => !file.type.startsWith('image/'));

    if (invalidFiles.length > 0) {
        $('#complaint-error').text('Please upload only image files for complaint photos');
        isValid = false;
    }
}




			// Validate forced lubrication files
			if (data.forced_lubrication_selection === 'yes') {
				const fileInput = document.getElementById('forcedLubricationFile');
				if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
					$('#forcedLubricationFile-error').text('Please upload photos or video for forced lubrication');
					isValid = false;
				} else {
					// Validate file types
					const files = Array.from(fileInput.files);
					const invalidFiles = files.filter(file => !file.type.startsWith('image/'));
					if (invalidFiles.length > 0) {
						$('#forcedLubricationFile-error').text('Please upload only image files');
						isValid = false;
					}
				}
			}	

            if (!isValid) {
                jSuites.notification({
                    name: "Gearbox Form",
                    message: "Please fill in all required fields correctly",
                    type: "error"
                });
            }

            return isValid;
        }
       // Reset form function
function resetForm() {
    $('input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], textarea, select').val('');
    $('input[type="radio"]').prop('checked', false);
    $('input[type="file"]').val(''); // ✅ Reset file inputs
    $('#forcedLubricationUpload').hide();
    $('.error-message').text('');

    // Reset territory dropdown to default
    $('#location').val('');
    $('#states-dropdown').val('').hide();

    // Reset forced lubrication selection
    $('#forcedLubricationSelect').val('');

    // Scroll to top
    window.scrollTo(0, 0);
}
